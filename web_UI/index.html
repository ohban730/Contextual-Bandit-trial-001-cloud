<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ReTube</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;700&family=Noto+Sans+JP:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="suggest.js" defer></script>
    <script src="feedback.js" defer></script>
    <script src="main.js" defer></script>
</head>

<body>
    <header class="logo"><span class="logo-accent">Re</span>Tube</header>
    <main id="chat">
        <div id="messages"></div>
    </main>
    <div id="composer">
        <div id="chip-list">
            <button type="button" class="chip selected" data-value="">すべて</button>
            <button type="button" class="chip" data-value="Music">音楽</button>
            <button type="button" class="chip" data-value="Gaming">ゲーム</button>
        </div>
        <button type="button" id="send-button" aria-label="送信">
            <svg width="30" height="38" viewBox="0 0 30 38" fill="none" xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true">
                <path
                    d="M16.1421 0.585785C15.3611 -0.195263 14.0947 -0.195263 13.3137 0.585785L0.58577 13.3137C-0.195279 14.0948 -0.195279 15.3611 0.58577 16.1421C1.36682 16.9232 2.63315 16.9232 3.4142 16.1421L14.7279 4.82843L26.0416 16.1421C26.8227 16.9232 28.089 16.9232 28.87 16.1421C29.6511 15.3611 29.6511 14.0948 28.87 13.3137L16.1421 0.585785ZM14.7279 38H16.7279L16.7279 2H14.7279H12.7279L12.7279 38H14.7279Z"
                    fill="currentColor" />
            </svg>
        </button>
    </div>
</body>

</html>
