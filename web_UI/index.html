<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Video Recommendation</title>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js"></script>
    <script src="suggest.js" defer></script>
    <script src="feedback.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelector('#submit').addEventListener('click', () => {
                const selectedCategory = document.querySelector('#genre-select').value;
                Suggest.main(selectedCategory);
            });
            document.querySelector('#good-btn').addEventListener('click', () => Feedback.main('good'));
            document.querySelector('#bad-btn').addEventListener('click', () => Feedback.main('bad'));
        });
    </script>
</head>

<body>
    <h1>Video Recommendation</h1>
    <div class="output-container">
        <label for="input-text">カテゴリ選択（今後対応）:</label>
        <select id="genre-select">
            <option value="">   未選択</option>
            <option value="Music">Music</option>
            <option value="Gaming">Gaming</option>
        </select>
        <button type="button" id="submit">おすすめ動画リクエスト</button>
        <p id="genre">カテゴリ</p>
        <p id="recommendations">おすすめ動画のタイトル</p>
    </div>
    <button type="button" id="good-btn" class="feedback-button">GOOD!</button>
    <button type="button" id="bad-btn" class="feedback-button">BAD</button>
    <br>
    <p id="feedback">フィードバック結果</p>
</body>

</html>
